name: Update Vortex release

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-vortex-release
  cancel-in-progress: false

jobs:
  update:
    name: Update to latest stable release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    outputs:
      branch: ${{ steps.open_pr.outputs.branch }}
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
      head_sha: ${{ steps.open_pr.outputs.head_sha }}
      base_sha: ${{ steps.base.outputs.base_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Capture main revision
        id: base
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/Nexus-Mods/Vortex/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          current="$(sed -n 's/^  version = "\([^"]*\)";/\1/p' package.nix)"
          if [[ -z "$current" ]]; then
            echo "Could not read the packaged version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == "$current" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Vortex $version is already packaged"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Updating Vortex from $current to $version"
          fi

      - name: Free runner disk space
        if: steps.release.outputs.update == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install Nix
        if: steps.release.outputs.update == 'true'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Update release metadata
        if: steps.release.outputs.update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          replacements = (
              (Path("package.nix"), r'(?m)^  version = "[^"]*";$', f'  version = "{os.environ["VERSION"]}";'),
              (Path("flake.nix"), r'(?m)^      url = "github:Nexus-Mods/Vortex/[^"]+";$', f'      url = "github:Nexus-Mods/Vortex/{os.environ["TAG"]}";'),
          )
          for path, pattern, replacement in replacements:
              contents = path.read_text()
              updated, count = re.subn(pattern, replacement, contents)
              if count != 1:
                  raise SystemExit(f"Expected one version reference in {path}, found {count}")
              path.write_text(updated)
          PY
          nix flake update vortex-src

      - name: Update mutable source hashes
        if: steps.release.outputs.update == 'true'
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          path = Path("package.nix")
          contents = path.read_text()
          for name in ("levelPivot",):
              pattern = rf'({name} = fetchurl \{{\n    url = "([^"]+)";\n    hash = )"[^"]+";'
              match = re.search(pattern, contents)
              if match is None:
                  raise SystemExit(f"Could not find mutable source {name}")
              result = subprocess.run(
                  ["nix", "store", "prefetch-file", "--json", match.group(2)],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              source_hash = json.loads(result.stdout)["hash"]
              contents, count = re.subn(
                  pattern,
                  rf'\1"{source_hash}";',
                  contents,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Expected one hash for {name}, found {count}")
          path.write_text(contents)
          PY

      - name: Update pnpm dependency hash
        if: steps.release.outputs.update == 'true'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("package.nix")
          contents = path.read_text()
          updated, count = re.subn(
              r'(fetcherVersion = 4;\n    hash = )"[^"]+";',
              r'\1lib.fakeHash;',
              contents,
          )
          if count != 1:
              raise SystemExit(f"Expected one pnpm dependency hash, found {count}")
          path.write_text(updated)
          PY

          set +e
          nix build '.#vortex.pnpmDeps' --no-link --print-build-logs 2>&1 | tee pnpm-hash.log
          build_status=${PIPESTATUS[0]}
          set -e
          hash="$(sed -n 's/^[[:space:]]*got:[[:space:]]*\(sha256-[A-Za-z0-9+/=]*\).*$/\1/p' pnpm-hash.log | tail -n 1)"
          rm pnpm-hash.log
          if [[ -z "$hash" ]]; then
            echo "Could not determine the pnpm dependency hash (build exited $build_status)" >&2
            exit 1
          fi

          HASH="$hash" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("package.nix")
          contents = path.read_text()
          updated, count = re.subn(
              r'(fetcherVersion = 4;\n    hash = )lib\.fakeHash;',
              rf'\1"{os.environ["HASH"]}";',
              contents,
          )
          if count != 1:
              raise SystemExit(f"Expected one fake pnpm dependency hash, found {count}")
          path.write_text(updated)
          PY

      - name: Verify update
        if: steps.release.outputs.update == 'true'
        run: |
          nix flake check --no-build
          nix build .#vortex --no-link --print-build-logs

      - name: Open update pull request
        id: open_pr
        if: steps.release.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          branch="automation/vortex-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add flake.nix flake.lock package.nix
          git commit -m "chore(vortex): update to $VERSION"
          head_sha="$(git rev-parse HEAD)"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$branch" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(vortex): update to $VERSION" \
              --body "Updates Vortex to the latest stable upstream GitHub release, v$VERSION. The updater passed the flake check and completed a package build before opening this pull request."
            pr_number="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$branch" \
              --base main \
              --json number \
              --jq '.[0].number // empty')"
          fi

          if [[ -z "$pr_number" ]]; then
            echo "Could not find the update pull request" >&2
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          remote_head_sha="$(jq -r '.head.sha' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          actual_branch="$(jq -r '.head.ref' <<<"$pr")"
          if [[ "$remote_head_sha" == "null" || "$base_sha" == "null" || "$actual_branch" != "$branch" ]]; then
            echo "The update pull request has unexpected metadata" >&2
            exit 1
          fi
          if [[ "$remote_head_sha" != "$head_sha" ]]; then
            echo "The pull request head does not match the verified commit" >&2
            exit 1
          fi
          if [[ "$base_sha" != "$BASE_SHA" ]]; then
            echo "The pull request is based on $base_sha, expected $BASE_SHA" >&2
            exit 1
          fi

          {
            echo "branch=$branch"
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

  merge:
    name: Merge verified update
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check merge preconditions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update.outputs.pr_number }}
          BRANCH: ${{ needs.update.outputs.branch }}
          HEAD_SHA: ${{ needs.update.outputs.head_sha }}
          BUILT_BASE_SHA: ${{ needs.update.outputs.base_sha }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr")"
          base_repo="$(jq -r '.base.repo.full_name // empty' <<<"$pr")"
          head_branch="$(jq -r '.head.ref' <<<"$pr")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr")"
          pr_base_ref="$(jq -r '.base.ref' <<<"$pr")"
          pr_base_sha="$(jq -r '.base.sha' <<<"$pr")"
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          [[ "$state" == "open" ]] || { echo "Pull request is not open" >&2; exit 1; }
          [[ "$draft" == "false" ]] || { echo "Pull request is a draft" >&2; exit 1; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo "Pull request head is not in this repository" >&2; exit 1; }
          [[ "$base_repo" == "$GITHUB_REPOSITORY" ]] || { echo "Pull request base is not in this repository" >&2; exit 1; }
          [[ "$head_branch" == "$BRANCH" ]] || { echo "Unexpected pull request branch: $head_branch" >&2; exit 1; }
          [[ "$pr_base_ref" == "main" ]] || { echo "Pull request does not target main" >&2; exit 1; }
          [[ "$pr_head_sha" == "$HEAD_SHA" ]] || { echo "Pull request head changed after the build" >&2; exit 1; }
          [[ "$pr_base_sha" == "$BUILT_BASE_SHA" ]] || { echo "Pull request base changed after the build" >&2; exit 1; }
          [[ "$current_main_sha" == "$BUILT_BASE_SHA" ]] || { echo "main changed after the build" >&2; exit 1; }

      - name: Merge update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update.outputs.pr_number }}
          HEAD_SHA: ${{ needs.update.outputs.head_sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --match-head-commit "$HEAD_SHA" \
            --squash

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr")"
          merged_at="$(jq -r '.merged_at // empty' <<<"$pr")"
          if [[ "$state" != "closed" || -z "$merged_at" ]]; then
            echo "Pull request merge was not confirmed" >&2
            exit 1
          fi

      - name: Build and cache main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main
